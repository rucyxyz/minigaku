<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>MiniGaku</title>
<style>
  :root {
    --bg: #f9fafb; --surface: #ffffff; --text: #111827; --text-muted: #6b7280;
    --border: #e5e7eb; --accent: #2563eb; --accent-bg: #eff6ff;
    --green: #10b981; --red: #ef4444; --orange: #d97706;
    --radius: 8px;
    --font: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "Hiragino Sans", Meiryo, sans-serif;
    --sidebar-w: 220px;
  }
  html[data-theme="dark"] {
    --bg: #000000; --surface: #111111; --text: #ffffff; --text-muted: #9ca3af;
    --border: #333333; --accent: #3b82f6; --accent-bg: #1e3a8a;
  }
  * { box-sizing: border-box; margin: 0; padding: 0; }
  body { font-family: var(--font); background: var(--bg); color: var(--text); line-height: 1.6; font-size: 15px; }
  a { color: inherit; text-decoration: none; }
  button { font-family: inherit; cursor: pointer; border: none; background: none; }

  .app { display: flex; min-height: 100vh; }
  
  /* サイドバー */
  .sidebar { width: var(--sidebar-w); background: var(--surface); border-right: 1px solid var(--border); position: fixed; top: 0; bottom: 0; left: 0; z-index: 40; display: flex; flex-direction: column; transition: transform 0.2s; }
  .sidebar-main { flex: 1; display: flex; flex-direction: column; padding-top: 24px; }
  .nav { display: flex; flex-direction: column; gap: 4px; padding: 0 12px; }
  .nav-item { display: flex; align-items: center; gap: 12px; padding: 10px 12px; border-radius: 6px; color: var(--text-muted); font-size: 14px; font-weight: 500; }
  .nav-item:hover { background: #222; color: var(--text); }
  .nav-item.active { background: #222; color: var(--text); font-weight: 600; }
  .nav-item svg { width: 18px; height: 18px; stroke: currentColor; fill: none; stroke-width: 2; }
  .sidebar-footer { padding: 16px 12px; border-top: 1px solid var(--border); }

  .main { flex: 1; margin-left: var(--sidebar-w); display: flex; flex-direction: column; }
  .topbar { height: 60px; background: var(--surface); border-bottom: 1px solid var(--border); display: flex; align-items: center; justify-content: space-between; padding: 0 24px; position: sticky; top: 0; z-index: 30; }
  .topbar-title { font-size: 15px; font-weight: 600; }
  .topbar-actions { display: flex; align-items: center; gap: 12px; }
  .theme-toggle { padding: 8px; border-radius: 6px; color: var(--text-muted); }
  .theme-toggle svg { width: 20px; height: 20px; stroke: currentColor; fill: none; stroke-width: 2; }
  
  .auth-buttons { display: flex; gap: 8px; }
  .auth-btn { padding: 6px 12px; border-radius: 6px; font-size: 13px; font-weight: 600; border: 1px solid var(--border); background: var(--surface); color: var(--text); transition: 0.2s; }
  .auth-btn:hover { background: #222; }
  .auth-btn.primary { background: var(--text); color: var(--bg); border-color: var(--text); }
  .auth-btn.primary:hover { opacity: 0.8; }
  html[data-theme="dark"] .auth-btn { border-color: #555; color: #fff; }
  html[data-theme="dark"] .auth-btn:hover { background: #333; }
  html[data-theme="dark"] .auth-btn.primary { background: #fff; color: #000; border-color: #fff; }

  .content { padding: 32px 24px 100px; max-width: 1000px; margin: 0 auto; width: 100%; }
  .mobile-menu { display: none; padding: 8px; color: var(--text); }
  @media (max-width: 768px) {
    .sidebar { transform: translateX(-100%); }
    .sidebar.open { transform: translateX(0); }
    .main { margin-left: 0; }
    .mobile-menu { display: block; }
    .content { padding: 20px 16px 100px; }
    .topbar { padding: 0 16px; }
    .auth-buttons { display: none; }
  }

  h1 { font-size: 24px; font-weight: 800; margin-bottom: 8px; }
  h2 { font-size: 18px; font-weight: 700; margin-bottom: 16px; }
  .muted { color: var(--text-muted); }
  .page-desc { color: var(--text-muted); font-size: 14px; margin-bottom: 24px; }
  .btn { display: inline-flex; align-items: center; justify-content: center; padding: 10px 20px; border-radius: var(--radius); font-size: 14px; font-weight: 600; border: 1px solid var(--border); background: var(--surface); color: var(--text); }
  .btn:hover { background: #222; }
  .btn-primary { background: var(--accent); color: #fff; border-color: var(--accent); }
  
  .stat-grid { display: grid; grid-template-columns: repeat(auto-fit, minmax(140px, 1fr)); gap: 16px; }
  .stat-card { padding: 20px; background: var(--surface); border: 1px solid var(--border); border-radius: var(--radius); }
  .stat-card .label { font-size: 13px; color: var(--text-muted); margin-bottom: 8px; }
  .stat-card .value { font-size: 28px; font-weight: 800; }

  /* ===== eBoard風 教科一覧 ===== */
  .eboard-header { font-size: 20px; font-weight: 800; margin-bottom: 24px; }
  .eboard-columns { display: flex; gap: 20px; }
  .eboard-col { flex: 1; }
  .eboard-col-title { font-size: 16px; font-weight: 600; margin-bottom: 20px; padding-bottom: 10px; border-bottom: 1px solid var(--border); text-align: center; }
  .eboard-subject { display: flex; align-items: center; gap: 16px; margin-bottom: 16px; text-decoration: none; color: var(--text); padding: 4px 0; }
  .eboard-subject:hover { opacity: 0.7; }
  .eboard-bar { width: 6px; height: 20px; border-radius: 3px; flex-shrink: 0; }
  .eboard-subject-info { display: flex; flex-direction: column; }
  .eboard-subject-name { font-size: 15px; font-weight: 500; color: var(--accent); }
  .eboard-subject-meta { font-size: 11px; color: var(--text-muted); font-weight: 400; }

  /* ===== eBoard風 単元一覧 ===== */
  .unit-header { display: flex; align-items: center; font-size: 13px; color: var(--text-muted); margin-bottom: 24px; }
  .unit-header a { color: var(--accent); text-decoration: underline; }
  .unit-layout { display: flex; gap: 0; background: var(--surface); border: 1px solid var(--border); border-radius: var(--radius); overflow: hidden; min-height: 600px; }
  
  .unit-sidebar { width: 240px; background: #1a2332; padding: 32px 24px; flex-shrink: 0; display: flex; flex-direction: column; align-items: center; }
  html[data-theme="light"] .unit-sidebar { background: #e2e8f0; }
  .unit-sidebar-title { font-size: 20px; font-weight: 800; margin-bottom: 48px; align-self: flex-start; }
  .progress-ring { width: 120px; height: 120px; border-radius: 50%; background: #0f172a; display: flex; align-items: center; justify-content: center; font-size: 28px; font-weight: 600; color: #d97706; box-shadow: 0 4px 6px rgba(0,0,0,0.2); }
  html[data-theme="light"] .progress-ring { background: var(--surface); color: #b45309; }
  
  .unit-main { flex: 1; padding: 32px 40px; background: var(--surface); }
  .unit-tabs { display: flex; gap: 24px; margin-bottom: 32px; border-bottom: 1px solid var(--border); padding-bottom: 12px; }
  .unit-tab { font-size: 15px; color: var(--text-muted); cursor: pointer; padding-bottom: 8px; margin-bottom: -13px; }
  .unit-tab.active { color: var(--text); font-weight: 600; border-bottom: 2px solid var(--text); }
  
  .unit-list { list-style: none; position: relative; }
  .unit-list::before { content: ''; position: absolute; left: 24px; top: 20px; bottom: 20px; width: 2px; background: var(--border); z-index: 1; }
  .unit-item { display: flex; align-items: center; gap: 20px; margin-bottom: 24px; cursor: pointer; position: relative; z-index: 2; text-decoration: none; color: var(--text); }
  .unit-icon { width: 50px; height: 50px; border-radius: 50%; background: var(--accent); color: #fff; display: flex; align-items: center; justify-content: center; font-size: 16px; font-weight: 700; border: 4px solid var(--surface); box-shadow: 0 0 0 1px var(--border); flex-shrink: 0; }
  .unit-text { flex: 1; font-size: 16px; color: var(--accent); font-weight: 500; }
  .unit-item:hover .unit-text { text-decoration: underline; }

  /* ===== クイズ画面 ===== */
  .quiz-container { max-width: 720px; margin: 0 auto; background: var(--surface); border: 1px solid var(--border); border-radius: var(--radius); overflow: hidden; }
  .quiz-header { padding: 16px 24px; border-bottom: 1px solid var(--border); display: flex; justify-content: space-between; align-items: center; }
  .quiz-title { font-size: 20px; font-weight: bold; display: flex; align-items: center; gap: 12px; }
  .quiz-badge { font-size: 12px; background: var(--accent-bg); color: var(--accent); padding: 4px 12px; border-radius: 20px; font-weight: 600; }
  .quiz-progress-bar { padding: 16px 24px; display: flex; align-items: center; gap: 12px; border-bottom: 1px solid var(--border); }
  .quiz-track { flex: 1; height: 12px; background: var(--border); border-radius: 6px; overflow: hidden; }
  .quiz-fill { height: 100%; background: #60a5fa; transition: width 0.3s; }
  .quiz-question-area { padding: 40px 24px 20px; text-align: center; position: relative; min-height: 200px; display: flex; align-items: center; justify-content: center; }
  .quiz-q-text { font-size: 24px; font-weight: bold; line-height: 1.6; white-space: pre-wrap; }
  .memo-btn { position: absolute; bottom: 16px; left: 16px; font-size: 24px; padding: 8px; }
  .memo-label { position: absolute; bottom: 4px; left: 16px; font-size: 10px; color: var(--text-muted); }
  .quiz-options { padding: 0 24px 24px; display: grid; grid-template-columns: 1fr 1fr; gap: 16px; }
  @media (max-width: 600px) { .quiz-options { grid-template-columns: 1fr; } }
  .quiz-opt { padding: 20px; font-size: 18px; font-weight: bold; border-radius: 30px; border: 2px solid var(--border); background: var(--surface); color: var(--text); position: relative; }
  .quiz-opt:hover:not(:disabled) { border-color: var(--accent); background: var(--accent-bg); }
  .quiz-opt.correct { background: var(--green); color: #fff; border-color: var(--green); }
  .quiz-opt.wrong { background: var(--red); color: #fff; border-color: var(--red); }
  .quiz-opt.correct::after { content: '○'; position: absolute; right: 16px; font-size: 20px; }
  .quiz-opt.wrong::after { content: '×'; position: absolute; right: 16px; font-size: 20px; }

  /* メモモーダル */
  .modal-overlay { position: fixed; inset: 0; background: rgba(0,0,0,0.5); z-index: 100; display: none; align-items: center; justify-content: center; padding: 16px; }
  .modal-overlay.open { display: flex; }
  .modal-content { background: var(--surface); width: 100%; max-width: 600px; height: 80vh; border-radius: var(--radius); display: flex; flex-direction: column; overflow: hidden; }
  .memo-textarea { flex: 1; padding: 24px; border: none; font-family: inherit; font-size: 16px; resize: none; background: var(--bg); color: var(--text); outline: none; }

  /* グラフ */
  .chart-wrap { display: flex; margin-top: 16px; }
  .chart-y { width: 50px; display: flex; flex-direction: column; justify-content: space-between; font-size: 11px; color: var(--text-muted); text-align: right; padding-right: 8px; height: 200px; }
  .chart-area { flex: 1; position: relative; height: 200px; border-left: 1px solid var(--border); border-bottom: 1px solid var(--border); }
  .chart-grid { position: absolute; inset: 0; display: flex; flex-direction: column; justify-content: space-between; }
  .chart-line { border-top: 1px dashed var(--border); width: 100%; }
  .chart-bars { position: absolute; inset: 0; display: flex; align-items: flex-end; gap: 4px; padding: 0 8px; }
  .chart-bar { flex: 1; display: flex; flex-direction: column; align-items: center; justify-content: flex-end; height: 100%; }
  .chart-fill { width: 100%; background: #8bc34a; border-radius: 0; min-height: 2px; }
  .chart-x { display: flex; gap: 4px; padding: 8px 8px 0 58px; }
  .chart-x-label { flex: 1; text-align: center; font-size: 11px; color: var(--text-muted); line-height: 1.4; }
  
  /* プロフィールなど */
  .profile-header { display: flex; align-items: center; gap: 20px; margin-bottom: 32px; }
  .profile-avatar { width: 80px; height: 80px; border-radius: 50%; background: var(--accent); color: #fff; display: flex; align-items: center; justify-content: center; font-size: 40px; font-weight: 800; }
</style>
</head>
<body>
<div class="app">
  <aside class="sidebar" id="sidebar">
    <div class="sidebar-main">
      <!-- サイト名をMiniGakuに変更 -->

    </div>
    <div class="sidebar-footer" id="sidebar-footer"></div>

  <main class="main">

        <button class="mobile-menu" id="menu-btn">
          <svg width="24" height="24" fill="none" stroke="currentColor" stroke-width="2"><path d="M3 12h18M3 6h18M3 18h18"/></svg>

    <div class="content" id="app"></div>
  </main>
</div>

const KEYS = { THEME:"sf.theme", PROGRESS:"sf.progress", SESSIONS:"sf.sessions", USER:"sf.user", USERS:"sf.users" };
function load(k, fb) { try { const v = localStorage.getItem(k); return v ? JSON.parse(v) : fb; } catch { return fb; } }
function save(k, v) { localStorage.setItem(k, JSON.stringify(v)); }
function todayStr() { return new Date().toISOString().slice(0,10); }
function fmtMin(m) { if (m<60) return m+"分"; const h=Math.floor(m/60), r=m%60; return r?`${h}時間${r}分`:`${h}時間`; }
function esc(s) { return String(s??"").replace(/&/g,"&amp;").replace(/</g,"&lt;").replace(/>/g,"&gt;"); }

function initTheme() {
  const saved = load(KEYS.THEME, null);
  const t = saved || (matchMedia("(prefers-color-scheme: dark)").matches?"dark":"light");
  document.documentElement.setAttribute("data-theme", t);
}
initTheme();
document.getElementById("theme-btn").onclick = () => {
  const cur = document.documentElement.getAttribute("data-theme");
  const next = cur === "dark" ? "light" : "dark";
  document.documentElement.setAttribute("data-theme", next);
  save(KEYS.THEME, next);
};

function getCurrentUser() { return load(KEYS.USER, null); }
function setCurrentUser(u) { save(KEYS.USER, u); }
function getUsers() { return load(KEYS.USERS, {}); }
function registerUser(email, password, name) {
  const users = getUsers();
  if (users[email]) return { ok:false, msg:"このメールアドレスは既に登録されています。" };
  users[email] = { email, password, name, bio:"", createdAt:Date.now() };
  save(KEYS.USERS, users);
  setCurrentUser({ email, name });
  return { ok:true };
}
function loginUser(email, password) {
  const users = getUsers();
  if (!users[email] || users[email].password !== password) return { ok:false, msg:"メールアドレスまたはパスワードが違います。" };
  setCurrentUser({ email, name:users[email].name });
  return { ok:true };
}
function logout() { localStorage.removeItem(KEYS.USER); }
function updateProfile(name, bio) {
  const cur = getCurrentUser(); if (!cur) return;
  const users = getUsers();
  if (users[cur.email]) {
    users[cur.email].name = name;
    users[cur.email].bio = bio;
    save(KEYS.USERS, users);
  }
  setCurrentUser({ ...cur, name });
}
function getGreeting() {
  const user = getCurrentUser();
  const name = user ? user.name : null;
  const hour = new Date().getHours();
  const sessions = getSessions();
  const today = todayStr();
  const hasToday = sessions.some(s => s.date === today);
  const lastSession = sessions.slice().sort((a,b)=>b.ts-a.ts)[0];
  const daysSince = lastSession ? Math.floor((Date.now() - lastSession.ts) / 86400000) : 0;
  if (!name) {
    if (hour < 11) return "おはようございます。";
    if (hour < 18) return "こんにちは。";
    return "こんばんは。";
  }
  if (daysSince > 1) return `${name}さん、お帰りなさい！${daysSince}日ぶりですね。`;
  if (hasToday) return `${name}さん、今日もお疲れ様です。`;
  if (hour < 11) return `${name}さん、おはようございます。`;
  if (hour < 18) return `${name}さん、こんにちは。`;
  return `${name}さん、こんばんは。`;
}

/* =========================================================================
   3. 学習記録
   ========================================================================= */
function getProgress() { return load(KEYS.PROGRESS, {}); }
function setProgress(id, correct, total) {
  const p = getProgress();
  p[id] = { correct, total, ratio: total?correct/total:0, date:todayStr() };
  save(KEYS.PROGRESS, p);
}
function getSessions() { return load(KEYS.SESSIONS, []); }
function addSession(label, minutes) {
  if (minutes<=0) return;
  const arr = getSessions();
  arr.push({ date:todayStr(), label, minutes, ts:Date.now() });
  save(KEYS.SESSIONS, arr);
}
function totalMinutes() { return getSessions().reduce((a,b)=>a+b.minutes,0); }
function todayMinutes() { return getSessions().filter(s=>s.date===todayStr()).reduce((a,b)=>a+b.minutes,0); }
function monthMinutes() { const m=todayStr().slice(0,7); return getSessions().filter(s=>s.date.slice(0,7)===m).reduce((a,b)=>a+b.minutes,0); }
function streak() {
  const dates = new Set(getSessions().map(s=>s.date));
  let count = 0; const d = new Date();
  while (true) {
    const ds = d.toISOString().slice(0,10);
    if (dates.has(ds)) { count++; d.setDate(d.getDate()-1); } else break;
  }
  return count;
}

      for (const [subject, grades] of Object.entries(subjects)) {
        let unitCount = 0;
        for (const gradeUnits of Object.values(grades)) {
          unitCount += gradeUnits.length;
        }

        let color = "#3b82f6";
        if (subject === "理科") color = "#10b981";
        if (subject === "社会") color = "#eab308";
        if (subject === "国語" || subject === "漢字") color = "#f87171";
        if (subject === "英語") color = "#f97316";

        html += `
          <a href="#/learn/${encodeURIComponent(stage)}/${encodeURIComponent(subject)}" class="eboard-subject">

      html += `</div>`;

  }

  const stage = decodeURIComponent(parts[1]);
  const subject = decodeURIComponent(parts[2]);

  if (!subjectData) { location.hash = "#/learn"; return; }

  // 【画面2】単元一覧（学年タブ付き）
  if (parts.length === 3) {
    pageTitle.textContent = subject;
    const grades = Object.keys(subjectData);
    const activeGrade = grades[0];

    let html = `
      <div class="unit-header">
        <a href="#/learn">教科一覧</a> &nbsp;/&nbsp; ${esc(subject)}
      </div>
      <div class="unit-layout">
        <div class="unit-sidebar">
          <div class="unit-sidebar-title">${esc(subject)}</div>
          <div class="progress-ring">0%</div>
        </div>
        <div class="unit-main">
          <div class="unit-tabs" id="unit-tabs">
            ${grades.map(g => `<div class="unit-tab ${g===activeGrade?'active':''}" data-grade="${g}">${g}</div>`).join("")}
          </div>
          <ul class="unit-list" id="unit-list">
            <!-- JSで描画 -->
          </ul>
        </div>
      </div>
    `;
    app.innerHTML = html;

    function drawUnits(grade) {
      const units = subjectData[grade] || [];
      const list = document.getElementById("unit-list");
      list.innerHTML = units.map((u, i) => {
        const icon = UNIT_ICONS[u] || (i + 1);
        // もくじの要素を削除
        return `
          <li>
            <a href="#/learn/${encodeURIComponent(stage)}/${encodeURIComponent(subject)}/${grade}/${i}" class="unit-item">
              <div class="unit-icon">${icon}</div>
              <div class="unit-text">${esc(u)}</div>
            </a>
          </li>
        `;
      }).join("");

    drawUnits(activeGrade);

    document.querySelectorAll(".unit-tab").forEach(tab => {
      tab.onclick = () => {
        document.querySelectorAll(".unit-tab").forEach(t => t.classList.remove("active"));
        tab.classList.add("active");
        drawUnits(tab.dataset.grade);
      };

}

function renderQuiz(unitName) {
  // ダミーの問題を10問生成
  const questions = [];
  for (let i = 0; i < 10; i++) {
    const correctNum = Math.floor(Math.random() * 100);
    const options = [correctNum];
    while (options.length < 4) {
      const r = Math.floor(Math.random() * 100);
      if (!options.includes(r)) options.push(r);
    }
    options.sort(() => Math.random() - 0.5);
    questions.push({
      q: `【${unitName}】の基本問題 ${i+1}\n（実際の問題文がここに入ります）`,
      opts: options.map(n => n.toString()),
      a: options.indexOf(correctNum),
      exp: `解説：${unitName}に関する正しい説明がここに入ります。`
    });
  }

  let currentQ = 0;
  let selected = null;
  let answers = [];
  let memoText = "";
  let startTime = Date.now();

  function drawQuiz() {
    if (currentQ >= questions.length) {
      // 結果画面
      const correct = answers.filter(a => a === true).length;
      const total = questions.length;
      const rate = Math.round((correct / total) * 100);
      setProgress(unitName, correct, total);
      addSession(unitName, Math.max(1, Math.round((Date.now()-startTime)/60000)));

      app.innerHTML = `
        <div style="max-width: 640px; margin: 0 auto;">
          <div style="text-align:center; padding: 40px 0; background: var(--surface); border: 1px solid var(--border); border-radius: var(--radius);">
            <h1 style="font-size: 32px; margin-bottom: 16px;">${correct} <span style="font-size:20px;color:var(--text-muted)">/ ${total}</span></h1>
            <p style="font-size: 16px; font-weight: 600; color: var(--text-muted); margin-bottom: 40px;">正答率: ${rate}%</p>
            <div style="display:flex; gap:12px; justify-content:center; flex-wrap:wrap;">
              <button class="btn btn-primary" onclick="location.hash='#/learn'">次の単元へ</button>
              <button class="btn" onclick="location.reload()">もう一度</button>
              <button class="btn" onclick="location.hash='#/learn'">メニューへ</button>
              <button class="btn" style="color:var(--red); border-color:var(--red);" onclick="alert('間違えた問題の復習画面（デモ）')">間違えた問題を確認</button>
            </div>
          </div>
        </div>
      `;
      return;
    }

    const q = questions[currentQ];
    const progressPercent = (currentQ / questions.length) * 100;
    const correctCount = answers.filter(a => a === true).length;
    const accuracy = answers.length > 0 ? Math.round((correctCount / answers.length) * 100) : 0;

    app.innerHTML = `
      <div style="max-width: 720px; margin: 0 auto;">
        <div class="unit-header">
          <a href="#/learn">教科一覧</a> &nbsp;/&nbsp; ${esc(unitName)}
        </div>
        <div class="quiz-container">
          <div class="quiz-header">
            <button style="font-size:24px; color:var(--text-muted);" onclick="location.hash='#/learn'">×</button>
            <div class="quiz-title">
              ${esc(unitName)} <span class="quiz-badge">基礎</span>
            </div>
            <div style="width:24px;"></div>
          </div>
          
          <div class="quiz-progress-bar">
            <div class="quiz-track">
              <div class="quiz-fill" style="width: ${progressPercent}%"></div>
            </div>
            <div style="font-size: 13px; font-weight: bold;">${currentQ + 1}/${questions.length}</div>
            <div style="font-size: 13px; font-weight: bold;">正答率:${accuracy}%</div>
          </div>

          <div class="quiz-question-area">
            <div class="quiz-q-text">${esc(q.q)}</div>
            <button class="memo-btn" onclick="window._openMemo()">📝</button>
            <div class="memo-label">Memo</div>
          </div>

          <div class="quiz-options">
            ${q.opts.map((opt, i) => {
              let cls = "quiz-opt";
              if (selected !== null) {
                if (i === q.a) cls += " correct";
                else if (i === selected) cls += " wrong";
              }
              return `<button class="${cls}" onclick="window._sel(${i})" ${selected !== null ? "disabled" : ""}>${esc(opt)}</button>`;
            }).join("")}
          </div>
        </div>
      </div>
    `;

    window._sel = (i) => {
      if (selected !== null) return;
      selected = i;
      answers[currentQ] = (i === q.a);
      drawQuiz();
      setTimeout(() => {
        currentQ++;
        selected = null;
        drawQuiz();
      }, 800);
    };

    window._openMemo = () => {
      const overlay = document.createElement("div");
      overlay.className = "modal-overlay open";
      overlay.id = "memo-modal";
      overlay.innerHTML = `
        <div class="modal-content">
          <div style="padding:16px;border-bottom:1px solid var(--border);display:flex;justify-content:space-between;align-items:center;">
            <span style="font-weight:bold;">✏️ メモ</span>
            <div style="display:flex;gap:16px;">
              <button style="font-size:14px;" onclick="document.getElementById('memo-textarea').value=''">消す</button>
              <button style="font-size:14px;background:var(--accent);color:#fff;padding:4px 12px;border-radius:16px;" onclick="window._closeMemo()">閉じる</button>
            </div>
          </div>
          <textarea class="memo-textarea" id="memo-textarea" placeholder="自由にメモを書いてください...">${memoText}</textarea>
        </div>
      `;
      document.body.appendChild(overlay);
      document.getElementById("memo-textarea").focus();
    };

    window._closeMemo = () => {
      const ta = document.getElementById("memo-textarea");
      if (ta) memoText = ta.value;
      const modal = document.getElementById("memo-modal");
      if (modal) modal.remove();
    };
  }
  drawQuiz();
}

    <p class="page-desc">学習の積み重ねを確認しましょう。</p>

    <div class="stat-grid" style="margin-bottom:40px;">
      <div class="stat-card"><div class="label">今日</div><div class="value">${fmtMin(tMin)}</div></div>
      <div class="stat-card"><div class="label">今月</div><div class="value">${fmtMin(mMin)}</div></div>
      <div class="stat-card"><div class="label">連続</div><div class="value">${s}<small style="font-size:14px;">日</small></div></div>
      <div class="stat-card"><div class="label">総学習時間</div><div class="value">${fmtMin(total)}</div></div>
    </div>

    <h2>直近7日間</h2>
    <div class="chart-wrap">
      <div class="chart-y">
        ${[4,3,2,1,0].map(v=>`<span>${v===0?'0分':v+'時間'}</span>`).join("")}
      </div>
      <div class="chart-area">
        <div class="chart-grid">
          ${[0,1,2,3,4].map(()=>`<div class="chart-line"></div>`).join("")}
        </div>
        <div class="chart-bars">
          ${week.map(w => `<div class="chart-bar" title="${fmtMin(w.min)}"><div class="chart-fill" style="height:${(w.min / (4*60)) * 100}%"></div></div>`).join("")}
        </div>
      </div>
    </div>
    <div class="chart-x">
      ${week.map(w=>`<div class="chart-x-label">${w.date.slice(5).replace("-","/")}<br>${w.dow}</div>`).join("")}
    </div>

    <h2 style="margin-top:40px;">タイマー</h2>
    <div style="background:var(--surface); border:1px solid var(--border); border-radius:var(--radius); padding:24px; text-align:center;">
      <div style="font-size: 48px; font-weight: 800; font-variant-numeric: tabular-nums; margin-bottom: 24px;" id="timer-display">00:00</div>
      <div style="display: flex; gap: 12px; justify-content: center;">
        <button class="btn btn-primary" id="timer-toggle">開始</button>
        <button class="btn" id="timer-reset">リセット</button>
        <button class="btn" id="timer-save">記録</button>
      </div>
    </div>

    <h2 style="margin-top:40px;">最近の学習履歴</h2>
    <div style="background:var(--surface); border:1px solid var(--border); border-radius:var(--radius); overflow:hidden;">
      ${sessions.slice().sort((a,b)=>b.ts-a.ts).slice(0,10).map((r,i,arr)=>`
        <div style="display:flex; justify-content:space-between; padding:12px 16px; ${i<arr.length-1?'border-bottom:1px solid var(--border);':''}">
          <div><div style="font-weight:500;">${esc(r.label)}</div><div class="muted" style="font-size:12px;">${r.date}</div></div>
          <div class="muted">${r.minutes}分</div>
        </div>
      `).join("") || '<div style="padding:16px; color:var(--text-muted);">履歴がありません。</div>'}
    </div>
  `;

  const display = document.getElementById("timer-display");
  const toggleBtn = document.getElementById("timer-toggle");
  function updateDisplay() {
    const m = String(Math.floor(timerSeconds/60)).padStart(2,"0");
    const sec = String(timerSeconds%60).padStart(2,"0");
    if (display) display.textContent = `${m}:${sec}`;
  }
  updateDisplay();
  if (timerRunning) { toggleBtn.textContent = "一時停止"; } else { toggleBtn.textContent = timerSeconds > 0 ? "再開" : "開始"; }

  toggleBtn.onclick = () => {
    if (timerRunning) {
      timerRunning = false;
      clearInterval(timerInterval);
      toggleBtn.textContent = "再開";
    } else {
      timerRunning = true;
      timerInterval = setInterval(() => { timerSeconds++; updateDisplay(); }, 1000);
      toggleBtn.textContent = "一時停止";
    }
  };
  document.getElementById("timer-reset").onclick = () => {
    timerRunning = false;
    clearInterval(timerInterval);
    timerSeconds = 0;
    updateDisplay();
    toggleBtn.textContent = "開始";
  };
  document.getElementById("timer-save").onclick = () => {
    const min = Math.round(timerSeconds/60);
    if (min > 0) {
      addSession("タイマー学習", min);
      timerSeconds = 0;
      updateDisplay();
      toggleBtn.textContent = "開始";
      timerRunning = false;
      clearInterval(timerInterval);
      renderRecord();
    } else {
      alert("1分以上計測してください。");
    }
  };
}

/* =========================================================================
   8. プロフィール
   ========================================================================= */
function getAvatarChar(name) {
  if (!name) return "?";
  return name.charAt(0).toUpperCase();
}

function renderProfile() {
  pageTitle.textContent = "プロフィール";
  const user = getCurrentUser();
  if (!user) {
    app.innerHTML = `
      <h1>プロフィール</h1>
      <p class="page-desc">アカウントを登録すると、プロフィールを設定できます。</p>
      <div style="display:flex; gap:12px;">
        <button class="btn btn-primary" onclick="openRegister()">会員登録</button>
        <button class="btn" onclick="openLogin()">ログイン</button>
      </div>
    `;
    return;
  }
  const users = getUsers();
  const u = users[user.email];
  const bio = u?.bio || "";
  app.innerHTML = `
    <h1>プロフィール</h1>
    <div style="background:var(--surface); border:1px solid var(--border); border-radius:var(--radius); padding:24px; max-width:480px;">
      <div class="profile-header">
        <div class="profile-avatar">${getAvatarChar(user.name)}</div>
        <div>
          <div style="font-size:20px; font-weight:700;">${esc(user.name)}</div>
          <div class="muted" style="font-size:13px;">${esc(user.email)}</div>
        </div>
      </div>
      <div class="form-group">
        <label>ユーザー名</label>
        <input type="text" id="pf-name" value="${esc(user.name)}">
      </div>
      <div class="form-group">
        <label>自己紹介</label>
        <textarea id="pf-bio" rows="4">${esc(bio)}</textarea>
      </div>
      <div style="display:flex; gap:12px; margin-top:24px;">
        <button class="btn btn-primary" style="flex:1;" onclick="saveProfile()">保存</button>
        <button class="btn" style="flex:1;" onclick="doLogout()">ログアウト</button>
      </div>
    </div>
  `;
  window.saveProfile = () => {
    const name = document.getElementById("pf-name").value.trim();
    const bio = document.getElementById("pf-bio").value.trim();
    if (!name) { alert("名前を入力してください"); return; }
    if (!/^[a-zA-Z0-9_]{3,20}$/.test(name)) {
      alert("ユーザー名は英数字とアンダーバー(_)のみ、3文字以上20文字以内で入力してください。");
      return;
    }
    updateProfile(name, bio);
    renderAuthButtons();
    alert("プロフィールを更新しました。");
    renderProfile();
  };
  window.doLogout = () => {
    if (!confirm("ログアウトしますか？")) return;
    logout();
    renderAuthButtons();
    renderSidebarFooter();
    location.hash = "#/home";
  };
}

/* =========================================================================
   9. モーダル
   ========================================================================= */
function openLogin() {
  const html = `
    <h3>ログイン</h3>
    <div class="form-group"><label>メールアドレス</label><input type="email" id="lg-email"></div>
    <div class="form-group"><label>パスワード</label><input type="password" id="lg-pass"></div>
    <div class="actions">
      <button class="btn" onclick="closeModal()">キャンセル</button>
      <button class="btn btn-primary" onclick="doLogin()">ログイン</button>
    </div>
  `;
  showModal(html);
  window.doLogin = () => {
    const email = document.getElementById("lg-email").value.trim();
    const pass = document.getElementById("lg-pass").value;
    if (!email || !pass) { alert("メールアドレスとパスワードを入力してください。"); return; }
    const r = loginUser(email, pass);
    if (!r.ok) { alert(r.msg); return; }
    closeModal(); renderAuthButtons(); renderSidebarFooter(); router();
  };
}

function openRegister() {
  const html = `
    <h3>会員登録</h3>
    <div class="form-group"><label>ユーザー名</label><input type="text" id="rg-name"></div>
    <div class="form-group"><label>メールアドレス</label><input type="email" id="rg-email"></div>
    <div class="form-group"><label>パスワード</label><input type="password" id="rg-pass"></div>
    <div class="form-group"><label>パスワード（確認）</label><input type="password" id="rg-pass-confirm"></div>
    <div class="actions">
      <button class="btn" onclick="closeModal()">キャンセル</button>
      <button class="btn btn-primary" onclick="doRegister()">登録</button>
    </div>
  `;
  showModal(html);
  window.doRegister = () => {
    const name = document.getElementById("rg-name").value.trim();
    const email = document.getElementById("rg-email").value.trim();
    const pass = document.getElementById("rg-pass").value;
    const passConfirm = document.getElementById("rg-pass-confirm").value;
    
    if (!name || !email || !pass || !passConfirm) { alert("全ての項目を入力してください。"); return; }
    if (!/^[a-zA-Z0-9_]{3,20}$/.test(name)) {
      alert("ユーザー名は英数字とアンダーバー(_)のみ、3文字以上20文字以内で入力してください。");
      return;
    }
    if (!/^[^\s@]+@[^\s@]+\.[^\s@]+$/.test(email)) { alert("メールアドレスの形式が正しくありません。"); return; }
    if (pass.length < 6) { alert("パスワードは6文字以上にしてください。"); return; }
    if (pass !== passConfirm) { alert("パスワードが一致しません。"); return; }
    
    const r = registerUser(email, pass, name);
    if (!r.ok) { alert(r.msg); return; }
    
    const chars = "ABCDEFGHIJKLMNOPQRSTUVWXYZ0123456789";
    let code = "";
    for (let i = 0; i < 6; i++) code += chars.charAt(Math.floor(Math.random() * chars.length));
    
    alert(`【メールアドレス認証】\nあなたのメールアドレス (${email}) に確認コードを送信しました。\n\n確認コード: ${code}`);
    
    const verifyHtml = `
      <h3>メールアドレス認証</h3>
      <p class="muted" style="font-size:13px; margin-bottom:16px; text-align:center;">6桁の英数字を入力してください。</p>
      <div class="form-group"><input type="text" id="verify-code" placeholder="XXXXXX" style="text-align:center; font-size:20px; letter-spacing:4px;"></div>
      <div class="actions">
        <button class="btn btn-primary" onclick="doVerify('${code}')">認証する</button>
      </div>
    `;
    showModal(verifyHtml);
    
    window.doVerify = (expectedCode) => {
      const input = document.getElementById("verify-code").value.trim();
      if (input.toUpperCase() === expectedCode) {
        alert("認証が完了しました！");
        closeModal();
        renderAuthButtons();
        renderSidebarFooter();
        router();
      } else {
        alert("認証コードが違います。");
      }
    };
  };
}

function showModal(innerHtml) {
  let overlay = document.getElementById("modal-overlay");
  if (!overlay) {
    overlay = document.createElement("div");
    overlay.className = "modal-overlay";
    overlay.id = "modal-overlay";
    overlay.innerHTML = `<div class="modal-content" id="modal-content"></div>`;
    document.body.appendChild(overlay);
    overlay.addEventListener("click", e => { if (e.target === overlay) closeModal(); });
  }
  document.getElementById("modal-content").innerHTML = innerHtml;
  overlay.classList.add("open");
}
function closeModal() {
  const overlay = document.getElementById("modal-overlay");
  if (overlay) overlay.classList.remove("open");
}

// 初期化
renderNav();
renderAuthButtons();
renderSidebarFooter();
if (!location.hash) location.hash = "#/home";
router();
</script>
