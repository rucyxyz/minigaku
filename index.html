<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>ミニ学 | 興味ある分野だけ5分で</title>
<style>
  :root {
    --bg: #f5f6f8;
    --surface: #ffffff;
    --text: #1a1a1a;
    --text-muted: #6b7280;
    --border: #e5e7eb;
    --primary: #2563eb;
    --primary-hover: #1d4ed8;
    --primary-disabled: #d1d5db;
    --secondary: #f3f4f6;
    --secondary-hover: #e5e7eb;
    --ok: #22c55e;
    --ok-bg: #f0fdf4;
    --ng: #ef4444;
    --ng-bg: #fef2f2;
    --ok-text: #16a34a;
    --ng-text: #dc2626;
    --card-shadow: 0 1px 3px rgba(0,0,0,0.05);
    --card-shadow-hover: 0 6px 16px rgba(0,0,0,0.08);
    --dot-inactive: #e5e7eb;
    --field-money: #fffbeb;
    --field-money-border: #fde68a;
    --field-psych: #faf5ff;
    --field-psych-border: #e9d5ff;
    --field-math: #eff6ff;
    --field-math-border: #bfdbfe;
  }
  html[data-theme="dark"] {
    --bg: #0f1115;
    --surface: #1a1d24;
    --text: #e6e8eb;
    --text-muted: #9aa3af;
    --border: #2a2f38;
    --primary: #3b82f6;
    --primary-hover: #60a5fa;
    --primary-disabled: #374151;
    --secondary: #2a2f38;
    --secondary-hover: #353b46;
    --ok: #22c55e;
    --ok-bg: #0f2a1a;
    --ng: #ef4444;
    --ng-bg: #2a1212;
    --ok-text: #4ade80;
    --ng-text: #f87171;
    --card-shadow: 0 1px 3px rgba(0,0,0,0.4);
    --card-shadow-hover: 0 6px 16px rgba(0,0,0,0.5);
    --dot-inactive: #374151;
    --field-money: #2a2410;
    --field-money-border: #4a3b15;
    --field-psych: #241a2a;
    --field-psych-border: #3b2a4a;
    --field-math: #101a2a;
    --field-math-border: #1e3050;
  }
  * { box-sizing: border-box; margin: 0; padding: 0; -webkit-tap-highlight-color: transparent; }
  body {
    font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", "Hiragino Sans", "Hiragino Kaku Gothic ProN", Meiryo, sans-serif;
    background: var(--bg);
    color: var(--text);
    min-height: 100vh;
    line-height: 1.6;
    transition: background 0.2s, color 0.2s;
  }
  header {
    background: var(--surface);
    border-bottom: 1px solid var(--border);
    padding: 12px 20px;
    position: sticky;
    top: 0;
    z-index: 10;
    display: flex;
    justify-content: space-between;
    align-items: center;
    gap: 12px;
  }
  header .logo {
    font-weight: 800;
    font-size: 20px;
    text-decoration: none;
    color: var(--text);
    flex-shrink: 0;
  }
  header .right {
    display: flex;
    align-items: center;
    gap: 12px;
  }
  header .streak {
    font-size: 13px;
    color: var(--text-muted);
    white-space: nowrap;
  }
  header .streak strong { color: #f59e0b; font-size: 15px; }
  .theme-btn {
    width: 40px; height: 40px;
    border-radius: 10px;
    border: 1px solid var(--border);
    background: var(--surface);
    color: var(--text);
    font-size: 18px;
    cursor: pointer;
    display: flex; align-items: center; justify-content: center;
    transition: background 0.15s;
  }
  .theme-btn:hover { background: var(--secondary); }

  main {
    max-width: 820px;
    margin: 0 auto;
    padding: 28px 16px 80px;
  }
  @media (min-width: 768px) {
    main { padding: 40px 24px 100px; }
  }
  h1.page-title { font-size: 24px; margin-bottom: 4px; line-height: 1.3; }
  @media (min-width: 768px) { h1.page-title { font-size: 28px; } }
  p.page-desc { color: var(--text-muted); margin-bottom: 24px; font-size: 14px; }
  .back-link {
    display: inline-block;
    color: var(--text-muted);
    font-size: 14px;
    text-decoration: none;
    margin-bottom: 16px;
    padding: 6px 0;
  }
  .back-link:hover { text-decoration: underline; }

  .fields-grid {
    display: grid;
    grid-template-columns: 1fr;
    gap: 12px;
  }
  @media (min-width: 600px) { .fields-grid { grid-template-columns: repeat(2, 1fr); gap: 14px; } }
  @media (min-width: 900px) { .fields-grid { grid-template-columns: repeat(3, 1fr); gap: 16px; } }

  .field-card {
    display: block;
    padding: 20px 18px;
    border-radius: 16px;
    text-decoration: none;
    color: var(--text);
    border: 2px solid var(--border);
    background: var(--surface);
    transition: transform 0.15s, box-shadow 0.15s;
  }
  .field-card:hover { transform: translateY(-2px); box-shadow: var(--card-shadow-hover); }
  .field-card .emoji { font-size: 32px; margin-bottom: 6px; }
  .field-card h2 { font-size: 18px; margin-bottom: 4px; }
  .field-card p { font-size: 12px; color: var(--text-muted); line-height: 1.5; }

  .topic-list { list-style: none; display: flex; flex-direction: column; gap: 10px; }
  .topic-item {
    display: flex;
    align-items: center;
    gap: 12px;
    background: var(--surface);
    border-radius: 14px;
    padding: 14px 16px;
    box-shadow: var(--card-shadow);
    transition: box-shadow 0.15s;
    text-decoration: none;
    color: var(--text);
    border: 1px solid var(--border);
  }
  .topic-item:hover { box-shadow: var(--card-shadow-hover); }
  .topic-item .num {
    color: var(--text-muted); font-size: 12px; min-width: 24px;
    width: 24px; height: 24px; border-radius: 50%;
    display: flex; align-items: center; justify-content: center;
    background: var(--secondary); flex-shrink: 0;
  }
  .topic-item .info { flex: 1; min-width: 0; }
  .topic-item .info .title { font-weight: 600; margin-bottom: 2px; font-size: 15px; }
  .topic-item .info .summary { font-size: 12px; color: var(--text-muted); }
  .topic-item .score { font-size: 12px; color: var(--ok-text); font-weight: 600; flex-shrink: 0; }
  .topic-item .level {
    display: inline-block;
    font-size: 10px;
    padding: 1px 6px;
    border-radius: 6px;
    margin-left: 6px;
    font-weight: 600;
    vertical-align: middle;
  }
  .level-basic { background: #dbeafe; color: #1e40af; }
  .level-apply { background: #fef3c7; color: #92400e; }
  html[data-theme="dark"] .level-basic { background: #1e3050; color: #93c5fd; }
  html[data-theme="dark"] .level-apply { background: #3b2a0f; color: #fcd34d; }

  .section-title {
    font-size: 13px;
    color: var(--text-muted);
    text-transform: uppercase;
    letter-spacing: 0.05em;
    margin: 24px 0 10px;
    font-weight: 700;
  }
  .section-title:first-child { margin-top: 0; }

  .card {
    background: var(--surface);
    border-radius: 16px;
    padding: 20px;
    box-shadow: var(--card-shadow);
    border: 1px solid var(--border);
  }
  @media (min-width: 768px) { .card { padding: 24px; } }
  .card h2 { font-size: 17px; margin-bottom: 14px; }
  .explanation {
    color: var(--text);
    font-size: 15px;
    line-height: 1.9;
    margin-bottom: 16px;
    white-space: pre-wrap;
  }
  .example-box {
    background: var(--secondary);
    border-radius: 12px;
    padding: 12px 14px;
    margin-bottom: 20px;
    font-size: 14px;
    line-height: 1.7;
  }
  .example-box .label {
    font-weight: 700;
    font-size: 12px;
    color: var(--text-muted);
    margin-bottom: 4px;
  }
  .btn-primary {
    width: 100%;
    background: var(--primary);
    color: #fff;
    border: none;
    border-radius: 12px;
    padding: 14px;
    font-size: 15px;
    font-weight: 600;
    cursor: pointer;
    transition: background 0.15s;
    font-family: inherit;
    min-height: 48px;
  }
  .btn-primary:hover:not(:disabled) { background: var(--primary-hover); }
  .btn-primary:disabled { background: var(--primary-disabled); cursor: default; }
  .btn-secondary {
    width: 100%;
    background: var(--secondary);
    color: var(--text);
    border: none;
    border-radius: 12px;
    padding: 14px;
    font-size: 15px;
    font-weight: 600;
    cursor: pointer;
    text-align: center;
    text-decoration: none;
    display: block;
    font-family: inherit;
    min-height: 48px;
  }
  .btn-secondary:hover { background: var(--secondary-hover); }

  .quiz-header {
    display: flex;
    justify-content: space-between;
    align-items: center;
    margin-bottom: 14px;
    font-size: 13px;
    color: var(--text-muted);
  }
  .dots { display: flex; gap: 4px; }
  .dot { width: 8px; height: 8px; border-radius: 50%; background: var(--dot-inactive); }
  .dot.ok { background: var(--ok); }
  .dot.ng { background: var(--ng); }
  .question-text { font-size: 16px; font-weight: 600; margin-bottom: 16px; }
  .choices { display: flex; flex-direction: column; gap: 8px; margin-bottom: 16px; }
  .choice {
    text-align: left;
    padding: 14px 16px;
    border: 2px solid var(--border);
    background: var(--surface);
    border-radius: 12px;
    font-size: 15px;
    cursor: pointer;
    transition: all 0.15s;
    font-family: inherit;
    color: var(--text);
    min-height: 48px;
  }
  .choice:hover:not(:disabled) { background: var(--secondary); }
  .choice:disabled { cursor: default; }
  .choice.correct { border-color: var(--ok); background: var(--ok-bg); }
  .choice.wrong { border-color: var(--ng); background: var(--ng-bg); }
  .choice.dim { opacity: 0.55; }
  .verdict { margin-bottom: 16px; }
  .verdict .label { font-weight: 600; margin-bottom: 4px; }
  .verdict .label.ok { color: var(--ok-text); }
  .verdict .label.ng { color: var(--ng-text); }
  .verdict .exp { font-size: 14px; color: var(--text); line-height: 1.7; }

  .result-card { text-align: center; }
  .result-card .label { font-size: 13px; color: var(--text-muted); margin-bottom: 4px; }
  .result-card .score-big { font-size: 48px; font-weight: 800; margin-bottom: 8px; }
  .result-card .msg { color: var(--text-muted); margin-bottom: 24px; font-size: 14px; }
  .btn-row { display: flex; gap: 10px; }
  .btn-row > * { flex: 1; }

  /* 検索 */
  .search-box {
    width: 100%;
    padding: 12px 14px;
    border-radius: 12px;
    border: 1px solid var(--border);
    background: var(--surface);
    color: var(--text);
    font-size: 15px;
    font-family: inherit;
    margin-bottom: 16px;
    min-height: 48px;
  }
  .search-box::placeholder { color: var(--text-muted); }
  .search-box:focus { outline: 2px solid var(--primary); outline-offset: -1px; }
</style>
</head>
<body>
<header>
  <a class="logo" href="#/">ミニ学</a>
  <div class="right">
    <div class="streak" id="streak-display"></div>
    <button class="theme-btn" id="theme-btn" aria-label="テーマ切替" title="ダーク/ライト切替">🌙</button>
  </div>
</header>
<main id="app"></main>

<script>
// ============================================================
// 分野データ（27分野）
// 各分野： id, name, emoji, group, description, topics[]
// 各トピック： id, title, summary, level("basic"|"apply"),
//             explanation, example, questions[3]
// ============================================================
const FIELDS_DATA = [
  // ---------- お金 ----------
  {
    id: "money", name: "お金", emoji: "💰", group: "生活・経済",
    description: "複利・投資・税金など、お金の基本を基礎から応用まで。",
    topics: [
      { id: "fukuri", title: "複利とは", summary: "利息にも利息がつく仕組み", level: "basic",
        explanation: "複利とは、元本だけでなく「利息にも利息がつく」計算方法です。\n100万円を年利5%で運用すると、1年後は105万円。2年目は「105万円に対して5%」がつくので、110.25万円になります。長く運用するほど、単利との差が大きくなります。",
        example: "100万円を年利5%で10年運用 → 単利は150万円、複利は約163万円。",
        questions: [
          { text: "100万円を年利5%の複利で2年間運用すると、2年後の金額は？", choices: ["110万円", "110.25万円", "105万円", "115万円"], correctIndex: 1, explanation: "1年後は105万円。2年目は105万円×1.05＝110.25万円です。" },
          { text: "複利の効果が大きくなるのはどんなとき？", choices: ["短期間で運用したとき", "長期間運用したとき", "利息が低いとき", "元本が少ないとき"], correctIndex: 1, explanation: "複利は期間が長いほど、利息の雪だるま式増加が効きます。" },
          { text: "単利と複利の違いは？", choices: ["単利は利息に利息がつく", "複利は利息に利息がつく", "単利は元本が増える", "どちらも同じ"], correctIndex: 1, explanation: "複利は利息にも利息がつきます。単利は元本にだけ利息がつきます。" }
        ]
      },
      { id: "tanpuku", title: "単利と複利の違い", summary: "利息の計算方法の違い", level: "basic",
        explanation: "単利は「元本だけ」に対して利息がつきます。複利は「元本＋利息」に対して利息がつきます。",
        example: "100万円を年利5%で10年運用 → 単利は150万円、複利は約163万円。",
        questions: [
          { text: "100万円を年利5%の単利で10年運用したときの利息の合計は？", choices: ["50万円", "63万円", "100万円", "5万円"], correctIndex: 0, explanation: "単利は毎年100万円の5%＝5万円。10年で50万円です。" },
          { text: "複利の方が単利より有利になるのは？", choices: ["短期間の運用", "長期間の運用", "利息が低いとき", "元本が0のとき"], correctIndex: 1, explanation: "期間が長いほど、複利と単利の差が広がります。" },
          { text: "元本100万円、年利5%の複利で1年後の金額は？", choices: ["100万円", "105万円", "110万円", "95万円"], correctIndex: 1, explanation: "100万円×1.05＝105万円です。" }
        ]
      },
      { id: "infure", title: "インフレとお金の価値", summary: "物価が上がるとお金の価値は下がる", level: "basic",
        explanation: "インフレとは物価が上がり、お金の価値が下がることです。同じ100円で買えるものが減っていきます。現金をタンスにしまっておくと、インフレによって実質的な価値が目減りする可能性があります。",
        example: "年2%のインフレが10年続くと、100万円の実質価値は約82万円相当に。",
        questions: [
          { text: "インフレになると、お金の価値はどうなる？", choices: ["上がる", "下がる", "変わらない", "倍になる"], correctIndex: 1, explanation: "物価が上がると、同じ金額で買えるものが減るので、お金の価値は下がります。" },
          { text: "インフレ時に現金をそのまま持っておくと？", choices: ["実質価値が増える", "実質価値が減る", "価値は変わらない", "税金的に有利"], correctIndex: 1, explanation: "物価上昇に現金の価値が追いつかず、実質的に目減りします。" },
          { text: "インフレの反対語は？", choices: ["リフレ", "デフレ", "スタグフレーション", "ハイパーインフレ"], correctIndex: 1, explanation: "物価が下がり続ける状態をデフレといいます。" }
        ]
      },
      { id: "bunsan", title: "分散投資", summary: "卵は一つのカゴに盛るな", level: "apply",
        explanation: "分散投資とは、資産を複数のものに分けて投資することです。「卵は一つのカゴに盛るな」という言葉通り、1つに集中すると大きく損をするリスクがあります。株式・債券・不動産など、値動きの異なるものに分けることでリスクを抑えます。",
        example: "日本株・米国株・債券・金を組み合わせると、1つが暴落しても全体の下落を緩和できる。",
        questions: [
          { text: "分散投資の目的は？", choices: ["リターンを最大化する", "リスクを抑える", "税金を減らす", "利息を増やす"], correctIndex: 1, explanation: "値動きの異なる資産に分けることで、全体のリスクを抑えるのが目的です。" },
          { text: "「卵は一つのカゴに盛るな」は何のたとえ？", choices: ["貯金", "分散投資", "保険", "税金"], correctIndex: 1, explanation: "1つのカゴを落とすと全部割れる＝1つに集中投資すると大損のリスクがあります。" },
          { text: "分散投資の例として正しいのは？", choices: ["1社の株だけ買う", "日本株と米国株と債券を買う", "現金だけ持つ", "借金して株を買う"], correctIndex: 1, explanation: "値動きの異なる複数の資産に分けるのが分散投資です。" }
        ]
      },
      { id: "risk-return", title: "リスクとリターン", summary: "高いリターンには高いリスクが伴う", level: "apply",
        explanation: "投資の世界では「ハイリスク・ハイリターン」が基本です。高いリターンを狙うほど、値下がりのリスクも大きくなります。逆に、元本保証の預金はリターンが小さい代わりにリスクも小さいです。",
        example: "預金（低リスク・低リターン）⇔ 株式（高リスク・高リターン）。",
        questions: [
          { text: "一般に、高いリターンを狙うとリスクは？", choices: ["小さくなる", "大きくなる", "変わらない", "ゼロになる"], correctIndex: 1, explanation: "高いリターンを狙うほど、値下がりのリスクも大きくなります。" },
          { text: "元本保証の預金の特徴は？", choices: ["高リターン・高リスク", "低リターン・低リスク", "高リターン・低リスク", "低リターン・高リスク"], correctIndex: 1, explanation: "預金は元本保証でリスクが低い代わりに、リターンも小さいです。" },
          { text: "「ハイリスク・ハイリターン」の意味は？", choices: ["リスクが高いほどリターンも高い", "リスクが高いほどリターンが低い", "リスクとリターンは無関係", "リスクがゼロでもリターンは高い"], correctIndex: 0, explanation: "高いリターンを狙うには、それ相応のリスクを取る必要があるという考え方です。" }
        ]
      },
      { id: "72rule", title: "72の法則", summary: "お金が2倍になる年数の目安", level: "basic",
        explanation: "「72の法則」は、お金が2倍になるまでの年数をざっくり計算する方法です。「72 ÷ 年利（%）」で求められます。",
        example: "年利6%なら 72÷6＝12年で2倍。年利8%なら 72÷8＝9年で2倍。",
        questions: [
          { text: "年利6%でお金が2倍になるのは約何年？", choices: ["6年", "12年", "20年", "72年"], correctIndex: 1, explanation: "72÷6＝12年です。" },
          { text: "72の法則で求まるのは？", choices: ["利息の合計", "2倍になるまでの年数", "税金の額", "リスクの大きさ"], correctIndex: 1, explanation: "72を年利で割ると、お金が2倍になる年数の目安がわかります。" },
          { text: "年利8%で2倍になるのは約何年？", choices: ["8年", "9年", "12年", "16年"], correctIndex: 1, explanation: "72÷8＝9年です。" }
        ]
      },
      { id: "tax", title: "税金の基本", summary: "稼いだら税金がかかる", level: "basic",
        explanation: "日本では、所得（稼いだお金）に対して所得税がかかります。また、モノを買うときには消費税（10%）がかかります。税金は私たちの生活を支える公共サービス（道路・学校・医療など）の財源です。",
        example: "給与の手取りは、所得税・住民税・社会保険料が引かれた残り。",
        questions: [
          { text: "モノを買うときにかかる税金は？", choices: ["所得税", "消費税", "住民税", "固定資産税"], correctIndex: 1, explanation: "買い物のときに払うのは消費税です（標準税率10%）。" },
          { text: "所得税は何にかかる？", choices: ["モノを買ったとき", "所得（稼いだお金）", "家を持ったとき", "車を買ったとき"], correctIndex: 1, explanation: "所得税は、給与などの所得に対してかかります。" },
          { text: "税金の使われ方として正しいのは？", choices: ["道路や学校などの公共サービス", "企業の利益", "個人の貯金", "株の配当"], correctIndex: 0, explanation: "税金は公共サービスを支える財源として使われます。" }
        ]

// テーマ管理
const THEME_KEY = "minigaku-theme";
function getPreferredTheme() {
  const saved = localStorage.getItem(THEME_KEY);
  if (saved === "dark" || saved === "light") return saved;
  return window.matchMedia("(prefers-color-scheme: dark)").matches ? "dark" : "light";
}
function applyTheme(theme) {
  document.documentElement.setAttribute("data-theme", theme);
  const btn = document.getElementById("theme-btn");
  if (btn) btn.textContent = theme === "dark" ? "☀️" : "🌙";
  localStorage.setItem(THEME_KEY, theme);
}
function toggleTheme() {
  const cur = document.documentElement.getAttribute("data-theme") || "light";
  applyTheme(cur === "dark" ? "light" : "dark");
}

// 進捗管理
const PROGRESS_KEY = "minigaku-progress";
const STREAK_KEY = "minigaku-streak";

function getProgress() {
  try { return JSON.parse(localStorage.getItem(PROGRESS_KEY) || "{}"); }
  catch { return {}; }
}
function saveResult(topicKey, score, total) {
  const p = getProgress();
  p[topicKey] = { completed: true, score, total, lastAttempt: new Date().toISOString() };
  localStorage.setItem(PROGRESS_KEY, JSON.stringify(p));
  updateStreak();
  renderStreak();
}
function updateStreak() {
  const today = new Date().toISOString().slice(0, 10);
  const yesterday = new Date(Date.now() - 86400000).toISOString().slice(0, 10);
  let streak = { lastDate: "", count: 0 };
  try {
    const raw = localStorage.getItem(STREAK_KEY);
    if (raw) streak = JSON.parse(raw);
  } catch {}
  if (streak.lastDate === today) return;
  streak.count = streak.lastDate === yesterday ? streak.count + 1 : 1;
  streak.lastDate = today;
  localStorage.setItem(STREAK_KEY, JSON.stringify(streak));
}
function getStreak() {
  try {
    const raw = localStorage.getItem(STREAK_KEY);
    return raw ? JSON.parse(raw).count : 0;
  } catch { return 0; }
}
function renderStreak() {
  const el = document.getElementById("streak-display");
  if (!el) return;
  const s = getStreak();
  el.innerHTML = s > 0 ? `🔥 連続 <strong>${s}</strong> 日` : "";
}

const app = document.getElementById("app");

function escapeHtml(s) {
  return String(s)
    .replace(/&/g, "&amp;")
    .replace(/</g, "&lt;")
    .replace(/>/g, "&gt;")
    .replace(/"/g, "&quot;")
    .replace(/'/g, "&#39;");
}

// グループ別に分野をまとめる
function groupFields() {
  const groups = {};
  for (const f of FIELDS_DATA) {
    const g = f.group || "その他";
    if (!groups[g]) groups[g] = [];
    groups[g].push(f);
  }
  // グループ順
  const order = ["自然科学", "人文・社会", "芸術・文化", "思考・リテラシー", "生活・健康", "言語・実用", "その他"];
  return order.filter(g => groups[g]).map(g => ({ name: g, fields: groups[g] }));
}

function renderHome(filterText = "") {
  const q = filterText.trim().toLowerCase();
  const groups = groupFields();
  let html = `
    <h1 class="page-title">興味ある分野だけ、5分で1トピック。</h1>
    <p class="page-desc">気になる分野を選んで、短い解説と例・クイズでサクッと学べます。全${FIELDS_DATA.length}分野。</p>
    <input class="search-box" id="search-box" placeholder="分野を検索（例：お金、心理、数学）" value="${escapeHtml(filterText)}" />
  `;
  for (const g of groups) {
    const matched = g.fields.filter(f =>
      !q || f.name.toLowerCase().includes(q) || f.description.toLowerCase().includes(q) || f.id.includes(q)
    );
    if (matched.length === 0) continue;
    html += `<div class="section-title">${escapeHtml(g.name)}</div>`;
    html += `<div class="fields-grid">`;
    for (const f of matched) {
      html += `
        <a class="field-card" href="#/${f.id}">
          <div class="emoji">${f.emoji}</div>
          <h2>${escapeHtml(f.name)}</h2>
          <p>${escapeHtml(f.description)}</p>
        </a>
      `;
    }
    html += `</div>`;
  }
  if (!html.includes("field-card")) {
    html += `<p style="color:var(--text-muted);text-align:center;padding:32px 0;">該当する分野が見つかりませんでした。</p>`;
  }
  app.innerHTML = html;

  const box = document.getElementById("search-box");
  box.addEventListener("input", (e) => {
    const val = e.target.value;
    const pos = e.target.selectionStart;
    renderHome(val);
    const newBox = document.getElementById("search-box");
    newBox.focus();
    newBox.setSelectionRange(pos, pos);
  });
}

function renderField(fieldId) {
  const f = FIELDS_DATA.find(x => x.id === fieldId);
  if (!f) return renderHome();
  const progress = getProgress();

  // レベル別に分類
  const basics = f.topics.filter(t => t.level === "basic");
  const applies = f.topics.filter(t => t.level === "apply");

  function renderList(list, startNum) {
    return list.map((t, i) => {
      const rec = progress[`${f.id}/${t.id}`];
      const num = startNum + i;
      return `
        <li>
          <a class="topic-item" href="#/${f.id}/${t.id}">
            <span class="num">${num}</span>
            <div class="info">
              <div class="title">${escapeHtml(t.title)}
                <span class="level level-${t.level}">${t.level === "basic" ? "基礎" : "応用"}</span>
              </div>
              <div class="summary">${escapeHtml(t.summary)}</div>
            </div>
            ${rec ? `<span class="score">✓ ${rec.score}/${rec.total}</span>` : ""}
          </a>
        </li>
      `;
    }).join("");
  }

  let html = `
    <a class="back-link" href="#/">← 分野一覧</a>
    <h1 class="page-title">${f.emoji} ${escapeHtml(f.name)}</h1>
    <p class="page-desc">${escapeHtml(f.description)}</p>
  `;
  if (basics.length > 0) {
    html += `<div class="section-title">基礎</div><ul class="topic-list">${renderList(basics, 1)}</ul>`;
  }
  if (applies.length > 0) {
    html += `<div class="section-title">応用</div><ul class="topic-list">${renderList(applies, basics.length + 1)}</ul>`;
  }
  app.innerHTML = html;
}

function renderTopic(fieldId, topicId) {
  const f = FIELDS_DATA.find(x => x.id === fieldId);
  if (!f) return renderHome();
  const t = f.topics.find(x => x.id === topicId);
  if (!t) return renderField(fieldId);

  let stage = "intro";
  let index = 0;
  let selected = null;
  let answers = [];

  function draw() {
    const backLink = `<a class="back-link" href="#/${f.id}">← ${escapeHtml(f.name)}</a>`;
    const title = `<h1 class="page-title">${escapeHtml(t.title)}</h1>`;

    if (stage === "intro") {
      app.innerHTML = `
        ${backLink}${title}
        <div class="card">
          <h2>解説</h2>
          <div class="explanation">${escapeHtml(t.explanation)}</div>
          ${t.example ? `
            <div class="example-box">
              <div class="label">具体例</div>
              ${escapeHtml(t.example)}
            </div>
          ` : ""}
          <button class="btn-primary" id="start-btn">クイズを始める（${t.questions.length}問）</button>
        </div>
      `;
      document.getElementById("start-btn").onclick = () => { stage = "quiz"; draw(); };
    }

    else if (stage === "quiz") {
      const q = t.questions[index];
      const dots = t.questions.map((_, i) => {
        let cls = "dot";
        if (answers[i] === true) cls += " ok";
        else if (answers[i] === false) cls += " ng";
        return `<span class="${cls}"></span>`;
      }).join("");

      const choices = q.choices.map((c, i) => {
        let cls = "choice";
        if (selected !== null) {
          if (i === q.correctIndex) cls += " correct";
          else if (i === selected) cls += " wrong";
          else cls += " dim";
        }
        return `<button class="${cls}" data-idx="${i}" ${selected !== null ? "disabled" : ""}>${escapeHtml(c)}</button>`;
      }).join("");

      const verdict = selected !== null ? `
        <div class="verdict">
          <div class="label ${selected === q.correctIndex ? "ok" : "ng"}">
            ${selected === q.correctIndex ? "正解！" : "不正解"}
          </div>
          <div class="exp">${escapeHtml(q.explanation)}</div>
        </div>
      ` : "";

      const isLast = index === t.questions.length - 1;

      app.innerHTML = `
        ${backLink}
        <div class="card">
          <div class="quiz-header">
            <span>問題 ${index + 1} / ${t.questions.length}</span>
            <div class="dots">${dots}</div>
          </div>
          <div class="question-text">${escapeHtml(q.text)}</div>
          <div class="choices">${choices}</div>
          ${verdict}
          <button class="btn-primary" id="next-btn" ${selected === null ? "disabled" : ""}>
            ${isLast ? "結果を見る" : "次の問題"}
          </button>
        </div>
      `;

      document.querySelectorAll(".choice").forEach(btn => {
        btn.onclick = () => {
          if (selected !== null) return;
          const i = parseInt(btn.dataset.idx);
          selected = i;
          answers[index] = i === q.correctIndex;
          draw();
        };
      });

      document.getElementById("next-btn").onclick = () => {
        if (selected === null) return;
        if (isLast) {
          const score = answers.filter(a => a === true).length;
          saveResult(`${f.id}/${t.id}`, score, t.questions.length);
          stage = "result";
          draw();
        } else {
          index++;
          selected = null;
          draw();
        }
      };
    }

    else if (stage === "result") {
      const score = answers.filter(a => a === true).length;
      const total = t.questions.length;
      const msg = score === total
        ? "全問正解！お見事です。"
        : "間違えた問題は、解説を読み返してみましょう。";
      app.innerHTML = `
        ${backLink}${title}
        <div class="card result-card">
          <div class="label">結果</div>
          <div class="score-big">${score} / ${total}</div>
          <div class="msg">${msg}</div>
          <div class="btn-row">
            <button class="btn-secondary" id="retry-btn">もう一度</button>
            <a class="btn-primary" href="#/${f.id}" style="text-decoration:none;display:flex;align-items:center;justify-content:center;">他のトピック</a>
          </div>
        </div>
      `;
      document.getElementById("retry-btn").onclick = () => {
        stage = "intro"; index = 0; selected = null; answers = [];
        draw();
      };
    }
  }

  draw();
}

// ルーター
let currentSearch = "";
function router() {
  const hash = location.hash.slice(1) || "/";
  const parts = hash.split("/").filter(Boolean);
  if (parts.length === 0) renderHome(currentSearch);
  else if (parts.length === 1) renderField(parts[0]);
  else renderTopic(parts[0], parts[1]);
  window.scrollTo(0, 0);
}

// 初期化
window.addEventListener("hashchange", router);
window.addEventListener("DOMContentLoaded", () => {
  applyTheme(getPreferredTheme());
  document.getElementById("theme-btn").onclick = toggleTheme;
  renderStreak();
  router();
});

// OSテーマ変更を監視（手動設定がない場合）
window.matchMedia("(prefers-color-scheme: dark)").addEventListener("change", (e) => {
  if (!localStorage.getItem(THEME_KEY)) {
    applyTheme(e.matches ? "dark" : "light");
  }
});
</script>
</body>
</html>
